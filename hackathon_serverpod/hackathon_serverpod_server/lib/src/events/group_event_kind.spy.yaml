### What happened, for the group's live Stream (PRODUCT.md §10.4, issue #65). One
### value per thing the issue names: propuesta, voto, contraoferta, validación,
### compra. `taskVoteCast` is a proposal-vote cast; `taskValidated` is a
### completion-vote cast — the codebase's own names for the two phases.
### `taskClaimed` came later: without it a task someone marked done only moved
### to "in validation" on the other phones after a reload.
### `memberExpelled` tells the expelled member's app to leave the group, and
### everyone else's to drop them from the member list.
### The four shop kinds make the shop live too (PLAN.md §1, "tiempo real"): a
### reward proposed or voted, and a purchase answered (accepted or refused,
### with its fine and refund) or delivered.
### `memberUpdated` is a member changing their name or avatar, so the other
### phones redraw the member list without a reload (#140).
### `memberLeft` is a member leaving on their own (#141); the admin role may
### have moved with it, so the others reload the member list.
enum: GroupEventKind
values:
  - taskProposed
  - taskVoteCast
  - taskCounterOffered
  - taskValidated
  - taskClaimed
  - purchased
  - memberExpelled
  - rewardProposed
  - rewardVoteCast
  - purchaseResponded
  - purchaseDelivered
  - memberUpdated
  - memberLeft
