### A bought RewardItem, pending until the chosen provider marks it delivered (PRODUCT.md §6,
### §10.2).
class: Purchase
table: purchase
fields:
  groupId: int, relation(parent=group)
  itemId: int, relation(parent=reward_item)
  buyerId: int, relation(parent=group_member)
  ### Who has to fulfil it, chosen by the buyer among the other members.
  providerId: int, relation(parent=group_member)
  status: PurchaseStatus, default=pending

indexes:
  purchase_group_id_idx:
    fields: groupId
  purchase_item_id_idx:
    fields: itemId
  purchase_buyer_id_idx:
    fields: buyerId
  purchase_provider_id_idx:
    fields: providerId
