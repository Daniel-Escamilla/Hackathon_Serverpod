# Repurposed as the run mode for the `server` service in docker-compose.yaml
# (there's no separate cloud staging environment for this hackathon project).
# The server runs inside the compose network here, reachable at the
# postgres/redis service names instead of localhost, so anyone with Docker
# gets the same backend on Linux, Windows or Mac without installing Dart.

apiServer:
  port: 8080
  publicHost: localhost
  publicPort: 8080
  publicScheme: http

insightsServer:
  port: 8081
  publicHost: localhost
  publicPort: 8081
  publicScheme: http

webServer:
  port: 8082
  publicHost: localhost
  publicPort: 8082
  publicScheme: http

database:
  host: postgres
  port: 5432
  name: hackathon_serverpod
  user: postgres

redis:
  enabled: false
  host: redis
  port: 6379

maxRequestSize: 524288

sessionLogs:
  persistentEnabled: true
  consoleEnabled: true
  consoleLogFormat: text
