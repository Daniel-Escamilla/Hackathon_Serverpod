# The backend on the OVH VPS behind youxinlab.com, next to other services
# already running there. Caddy on the host terminates HTTPS and proxies:
#   serverpod.youxinlab.com      -> 127.0.0.1:18082 (web app + /auth/callback)
#   api.serverpod.youxinlab.com  -> 127.0.0.1:18080 (API)
# Insights stays on 127.0.0.1:18081, reachable only through an SSH tunnel.
#
# The image is built elsewhere (see README.md beside this file) and loaded
# with `docker load`; the secrets live in .env beside this file, never in git.
name: hackathon-serverpod

services:
  server:
    image: hackathon-serverpod:ovh
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:18081:8081"
      - "127.0.0.1:18082:8082"
    env_file: .env
    environment:
      runmode: production
      SERVERPOD_API_SERVER_PUBLIC_HOST: api.serverpod.youxinlab.com
      SERVERPOD_API_SERVER_PUBLIC_PORT: "443"
      SERVERPOD_API_SERVER_PUBLIC_SCHEME: https
      SERVERPOD_WEB_SERVER_PUBLIC_HOST: serverpod.youxinlab.com
      SERVERPOD_WEB_SERVER_PUBLIC_PORT: "443"
      SERVERPOD_WEB_SERVER_PUBLIC_SCHEME: https
      SERVERPOD_INSIGHTS_SERVER_PUBLIC_HOST: localhost
      SERVERPOD_INSIGHTS_SERVER_PUBLIC_PORT: "18081"
      SERVERPOD_INSIGHTS_SERVER_PUBLIC_SCHEME: http
      SERVERPOD_DATABASE_HOST: postgres
      SERVERPOD_DATABASE_PORT: "5432"
      SERVERPOD_DATABASE_NAME: hackathon_serverpod
      SERVERPOD_DATABASE_USER: postgres
      SERVERPOD_DATABASE_REQUIRE_SSL: "false"
      # Browsers may only call the API from the web app; phone builds send no
      # Origin header, so they are not affected.
      SERVERPOD_ALLOWED_ORIGINS: https://serverpod.youxinlab.com
      SERVERPOD_REDIS_ENABLED: "false"
      SERVERPOD_SESSION_CONSOLE_LOG_ENABLED: "true"
    depends_on:
      - postgres

  postgres:
    image: ghcr.io/serverpod/postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: hackathon_serverpod
      POSTGRES_PASSWORD: ${SERVERPOD_DATABASE_PASSWORD}
    volumes:
      - data:/var/lib/postgresql/data

volumes:
  data:
