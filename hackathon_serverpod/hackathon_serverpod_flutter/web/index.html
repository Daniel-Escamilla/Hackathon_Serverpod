<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Los acuerdos de casa se deciden entre todos: proponed tareas, fijad su precio y ganad monedas para la tienda del grupo.">
  <meta name="theme-color" content="#6558F5">

  <!--
    Link previews (WhatsApp, Telegram, Slack, X...). Crawlers do not run
    JavaScript, so these have to be in the static HTML, and og:image has to
    be an absolute URL. og.png is rendered by tool/brand/render.sh.
  -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_ES">
  <meta property="og:url" content="https://serverpod.youxinlab.com/">
  <meta property="og:title" content="Las tareas de casa, por fin justas">
  <meta property="og:description" content="Proponed tareas, fijad su precio entre todos y ganad monedas para la tienda del grupo. Para pisos compartidos, parejas y familias.">
  <meta property="og:image" content="https://serverpod.youxinlab.com/og.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Una casa con una moneda y un tic: las tareas de casa, por fin justas.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Las tareas de casa, por fin justas">
  <meta name="twitter:description" content="Proponed tareas, fijad su precio entre todos y ganad monedas para la tienda del grupo.">
  <meta name="twitter:image" content="https://serverpod.youxinlab.com/og.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tareas justas">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="icon" type="image/svg+xml" href="logo.svg"/>

  <title>Las tareas de casa, por fin justas</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
