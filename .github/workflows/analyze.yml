name: Analyze

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'

      - name: Install dependencies
        working-directory: hackathon_serverpod
        run: flutter pub get

      - name: Analyze
        working-directory: hackathon_serverpod/hackathon_serverpod_server
        run: dart analyze --fatal-infos
