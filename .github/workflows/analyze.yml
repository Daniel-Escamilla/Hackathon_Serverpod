name: Analyze

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'

      - name: Install dependencies
        working-directory: hackathon_serverpod
        run: flutter pub get

      - name: Analyze the server
        working-directory: hackathon_serverpod/hackathon_serverpod_server
        run: dart analyze --fatal-infos

      # The app, held to the same bar as the server. Runs even when the server
      # step fails, so one PR reports every broken package at once.
      - name: Analyze the app
        if: ${{ !cancelled() }}
        working-directory: hackathon_serverpod/hackathon_serverpod_flutter
        run: flutter analyze --fatal-infos
